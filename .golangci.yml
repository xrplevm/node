version: "2"
run:
  concurrency: 4
  tests: true
linters:
  # Only the linters listed below run, nothing is enabled implicitly
  default: none
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - goconst
    - gocritic
    - gomodguard
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - nilnesserr
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dogsled:
      max-blank-identifiers: 3
    errcheck:
      # An unchecked type assertion panics, which can halt the chain in BeginBlock or EndBlock
      check-type-assertions: true
    exhaustive:
      # A switch with a default case already handles every enum value
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^time\.(Now|Since|Until)$
          msg: wall-clock time is non-deterministic, use the block time from sdk.Context instead
    govet:
      enable:
        - nilness
    gomodguard:
      blocked:
        versions:
          - https://github.com/etcd-io/etcd:
              version: '>= 3.4.10 || ~3.3.23'
              reason: CVE-2020-15114; CVE-2020-15136; CVE-2020-15115
          - https://github.com/dgrijalva/jwt-go:
              version: '>= 4.0.0-preview1'
              reason: CVE-2020-26160
    misspell:
      locale: US
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    warn-unused: true
    rules:
      # The wall-clock ban only applies to state machine code
      - linters:
          - forbidigo
        path-except: ^(app|x)/
      - linters:
          - forbidigo
        path: (_test\.go|/simulation/)
      # Renaming the existing utils/types packages is not worth the churn
      - linters:
          - revive
        text: "var-naming: avoid meaningless package names"
issues:
  # Report every finding instead of capping them per linter, per message or per line
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
