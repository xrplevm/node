name: "Pull Request"

on:
    pull_request:
        types: [opened, synchronize]
    # Runs on main only to seed the Go and lint caches that PR runs restore from
    push:
        branches:
            - "main"

permissions: {}

concurrency:
    # Cancel old runs if there is a new commit in the same branch
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    persist-credentials: false
            -   uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
                with:
                    go-version-file: go.mod
                    # Separate cache key from the integration job so both jobs save their own cache
                    cache-dependency-path: |
                        go.sum
                        .golangci.yml
            -   uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
                with:
                    version-file: .golangci-lint-version
                    args: --timeout=10m

    integration:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    persist-credentials: false
            -   uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
                with:
                    go-version-file: go.mod
            -   name: Unit tests
                run: make test-poa
            -   name: Integration tests
                run: make test-integration
