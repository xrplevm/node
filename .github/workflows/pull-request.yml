name: "Pull Request"

on:
    pull_request:
        types: [opened, synchronize]
    # Runs on main only to seed the Go and lint caches that PR runs restore from
    push:
        branches:
            - "main"

permissions: {}

concurrency:
    # Cancel old runs if there is a new commit in the same branch
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    persist-credentials: false
            -   uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
                with:
                    go-version-file: go.mod
                    # Separate cache key from the integration job so both jobs save their own cache
                    cache-dependency-path: |
                        go.sum
                        .golangci.yml
            -   uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
                with:
                    version-file: .golangci-lint-version
                    args: --timeout=10m

    upgrade-binary:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    persist-credentials: false
            -   uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
                with:
                    go-version-file: go.mod
                    cache: false
            -   name: Launcher tests
                working-directory: cmd/exrpd-upgrade
                run: |
                    GOWORK=off go vet ./...
                    GOWORK=off go test -count=1 ./...
            # The root lint job stops at the nested go.mod, so the launcher module is linted here.
            -   uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
                with:
                    working-directory: cmd/exrpd-upgrade
                    version-file: ../../.golangci-lint-version
                    args: --config ../../.golangci.yml --timeout=10m
            -   name: Patched Cosmovisor tests
                run: scripts/upgrade-binary/cosmovisor.sh --test

    # Chain upgrade with an upgrade binary built from the PR and the published genesis
    # release. It runs only when the PR changes the upgrade binary.
    upgrade-binary-e2e:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    persist-credentials: false
                    fetch-depth: 0
            -   name: Check the PR changes the upgrade binary
                id: changes
                env:
                    BASE_SHA: ${{ github.event.pull_request.base.sha }}
                run: |
                    if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(cmd/exrpd-upgrade|scripts/upgrade-binary)/'; then
                        echo "run=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "run=false" >> "$GITHUB_OUTPUT"
                    fi
            -   if: steps.changes.outputs.run == 'true'
                uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
                with:
                    go-version-file: go.mod
            -   name: End-to-end test of the upgrade binary
                if: steps.changes.outputs.run == 'true'
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    source scripts/upgrade-binary/bundle.env
                    version=${UPGRADE_PLAN#v} cache=$PWD/.e2e-cache
                    make build VERSION="$version"
                    mkdir -p "$cache"
                    cp bin/exrpd "$cache/exrpd-$version-linux-amd64"
                    gh release download "v$GENESIS_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$cache" \
                        --pattern "node_${GENESIS_VERSION}_Linux_amd64.tar.gz" --pattern checksums.txt
                    CACHE=$cache UPGRADE_VERSION=$version scripts/upgrade-binary/e2e.sh

    integration:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    persist-credentials: false
            -   uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
                with:
                    go-version-file: go.mod
            -   name: Unit tests
                run: make test-poa
            -   name: App tests
                run: make test-app
            -   name: Integration tests
                run: make test-integration

    simulation:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                target:
                    - test-sim-benchmark-simulation
                    - test-sim-full-app-fast
        steps:
            -   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
                with:
                    persist-credentials: false
            -   uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
                with:
                    go-version-file: go.mod
            -   name: Simulation tests
                run: make ${{ matrix.target }}
