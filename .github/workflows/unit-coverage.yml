name: Coverage
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

permissions: {}

jobs:
  build:
    name: Unit test
    # Skip private-dependent runs for pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0

      - name: Configure private EVM access
        uses: ./.github/actions/private-evm-ssh
        with:
          ssh-key: ${{ secrets.EVM_FORK_SSH_KEY_NOV_2026 }}
          configure-go: "true"

      - name: Generate unit test coverage
        run: make coverage-unit

      - name: Check unit test coverage
        uses: vladopajic/go-test-coverage@f190f667e23b4441202d0bab0f8c2e7bce8925b6 # v2.18.4
        with:
          # Configure action using config file (option 1)
          config: ./.testcoverage.yml
