name: GoReleaser
on:
  workflow_dispatch:
    inputs:
      commit_branch:
        description: The branch or the commit sha to push tag to
        required: true
  workflow_call:
    inputs:
      commit_branch:
        type: string
        description: The branch or the commit sha to push tag to
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_branch }}
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-buildx-action@v2
      - name: Configure private EVM access
        uses: ./.github/actions/private-evm-ssh
        with:
          ssh-key: ${{ secrets.EVM_FORK_SSH_KEY }}
      # Build and push docker image
      - name: Run go releaser
        run: |
          docker run --rm \
            -e CGO_ENABLED \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GOPRIVATE=github.com/xrplevm/evm-priv-jul2026 \
            -e SSH_AUTH_SOCK=/ssh-agent \
            -v "$SSH_AUTH_SOCK:/ssh-agent" \
            -v "$HOME/.ssh/known_hosts:/root/.ssh/known_hosts:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/go/src/exrp" \
            -w /go/src/exrp \
            --entrypoint /bin/sh \
            goreleaser/goreleaser-cross:v1.22 -c \
            'git config --global --add safe.directory /go/src/exrp && \
             git config --global url."ssh://git@github.com/xrplevm/evm-priv-jul2026".insteadOf "https://github.com/xrplevm/evm-priv-jul2026" && \
             goreleaser release --clean --skip validate'
