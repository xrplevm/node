name: GoReleaser
on:
  workflow_dispatch:
    inputs:
      commit_branch:
        description: The branch or the commit sha to push tag to
        required: true
  workflow_call:
    inputs:
      commit_branch:
        type: string
        description: The branch or the commit sha to push tag to
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit_branch }}
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Configure private EVM access
        uses: ./.github/actions/private-evm-ssh
        with:
          ssh-key: ${{ secrets.EVM_FORK_SSH_KEY_NOV_2026 }}
      # Build and push docker image
      - name: Run go releaser
        run: |
          docker run --rm \
            -e CGO_ENABLED \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GOPRIVATE=github.com/xrplevm/cosmos-evm-priv-nov-1-2026 \
            -e SSH_AUTH_SOCK=/ssh-agent \
            -v "$SSH_AUTH_SOCK:/ssh-agent" \
            -v "$HOME/.ssh/known_hosts:/root/.ssh/known_hosts:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/go/src/exrp" \
            -w /go/src/exrp \
            --entrypoint /bin/sh \
            goreleaser/goreleaser-cross:v1.22 -c \
            'git config --global --add safe.directory /go/src/exrp && \
             git config --global url."ssh://git@github.com/xrplevm/cosmos-evm-priv-nov-1-2026".insteadOf "https://github.com/xrplevm/cosmos-evm-priv-nov-1-2026" && \
             goreleaser release --clean --skip validate'
